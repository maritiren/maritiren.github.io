<div class="tabs-container">
  {{ .Inner }}
</div>
{{ if not (.Page.Store.Get "tabsScriptAdded") }}
{{ .Page.Store.Set "tabsScriptAdded" true }}
<script>
(function () {
  function initTabs() {
    document.querySelectorAll('.tabs-container').forEach(function (container) {
      if (container.dataset.initialized) return;
      container.dataset.initialized = 'true';

      var panels = Array.from(container.querySelectorAll(':scope > .tab-panel'));
      if (!panels.length) return;

      var bar = document.createElement('div');
      bar.className = 'tab-bar';
      bar.setAttribute('role', 'tablist');

      panels.forEach(function (panel, i) {
        var btn = document.createElement('button');
        btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
        btn.textContent = panel.dataset.tabTitle || ('Tab ' + (i + 1));
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
        btn.type = 'button';

        btn.addEventListener('click', function () {
          panels.forEach(function (p) { p.classList.remove('active'); });
          bar.querySelectorAll('.tab-btn').forEach(function (b) {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          panel.classList.add('active');
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
        });

        bar.appendChild(btn);
        if (i === 0) panel.classList.add('active');
      });

      container.insertBefore(bar, panels[0]);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTabs);
  } else {
    initTabs();
  }
})();
</script>
{{ end }}
